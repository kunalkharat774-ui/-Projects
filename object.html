<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Object Detection Scanner</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0b1020;
    color:white;
    overflow:hidden;
}

.container{
    position:relative;
    width:100vw;
    height:100vh;
}

video, canvas{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
}

.topbar{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    padding:15px;
    background:rgba(0,0,0,0.5);
    z-index:10;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.title{
    font-size:22px;
    font-weight:bold;
    color:#00ffcc;
    text-shadow:0 0 10px #00ffcc;
}

.controls{
    display:flex;
    gap:10px;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    background:#00ffcc;
    color:black;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
    background:#00ffaa;
}

.scan-line{
    position:absolute;
    width:100%;
    height:4px;
    background:#00ffcc;
    top:0;
    z-index:5;
    box-shadow:0 0 20px #00ffcc;
    animation:scan 2s linear infinite;
}

@keyframes scan{
    0%{ top:0; }
    50%{ top:95%; }
    100%{ top:0; }
}

.info-panel{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    background:rgba(0,0,0,0.6);
    padding:15px;
    z-index:10;
    max-height:200px;
    overflow:auto;
}

.info-panel h2{
    margin-bottom:10px;
    color:#00ffcc;
}

#detections{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.detect-box{
    background:#00ffcc;
    color:black;
    padding:8px 12px;
    border-radius:8px;
    font-weight:bold;
}

.loading{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    z-index:50;
    font-size:22px;
    color:#00ffcc;
}
</style>
</head>

<body>

<div class="loading" id="loading">
Loading Model...
</div>

<div class="container">

    <div class="topbar">
        <div class="title">Object Detection Scanner</div>

        <div class="controls">
            <button id="startBtn">Start Camera</button>
            <button id="stopBtn">Stop Camera</button>
        </div>
    </div>

    <div class="scan-line"></div>

    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>

    <div class="info-panel">
        <h2>Detected Objects</h2>
        <div id="detections"></div>
    </div>

</div>

<!-- TensorFlow -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

<!-- COCO SSD -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const loading = document.getElementById('loading');
const detectionsDiv = document.getElementById('detections');

const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');

let model;
let stream;
let detecting = false;

async function loadModel(){
    model = await cocoSsd.load();
    loading.style.display = "none";
}

async function startCamera(){

    try{
        stream = await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:"environment"
            },
            audio:false
        });

        video.srcObject = stream;

        video.onloadedmetadata = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            detecting = true;
            detectObjects();
        };

    }catch(err){
        alert("Camera Access Denied!");
        console.error(err);
    }
}

function stopCamera(){

    detecting = false;

    if(stream){
        stream.getTracks().forEach(track => track.stop());
    }

    ctx.clearRect(0,0,canvas.width,canvas.height);
    detectionsDiv.innerHTML = "";
}

async function detectObjects(){

    if(!detecting) return;

    const predictions = await model.detect(video);

    ctx.clearRect(0,0,canvas.width,canvas.height);

    detectionsDiv.innerHTML = "";

    predictions.forEach(pred => {

        const [x,y,width,height] = pred.bbox;

        // Box
        ctx.strokeStyle = "#00ffcc";
        ctx.lineWidth = 3;
        ctx.strokeRect(x,y,width,height);

        // Label
        ctx.fillStyle = "#00ffcc";
        ctx.font = "18px Arial";
        ctx.fillText(
            `${pred.class} (${Math.round(pred.score * 100)}%)`,
            x,
            y > 20 ? y - 5 : 20
        );

        // UI detection panel
        const div = document.createElement("div");
        div.className = "detect-box";
        div.innerText = `${pred.class} - ${Math.round(pred.score * 100)}%`;

        detectionsDiv.appendChild(div);

    });

    requestAnimationFrame(detectObjects);
}

startBtn.addEventListener('click', startCamera);
stopBtn.addEventListener('click', stopCamera);

loadModel();
</script>

</body>
</html>
