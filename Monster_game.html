<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Monster Hunter Game</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:linear-gradient(to bottom,#0f172a,#1e293b);
  overflow:hidden;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}

.game-container{
  position:relative;
  width:100%;
  max-width:500px;
  height:100vh;
  overflow:hidden;
}

.top-bar{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(0,0,0,0.5);
  z-index:10;
}

.top-bar h2{
  font-size:22px;
}

.score,
.timer{
  font-size:18px;
  font-weight:bold;
}

#gameArea{
  position:relative;
  width:100%;
  height:100%;
}

.monster{
  position:absolute;
  width:95px;
  height:95px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:52px;
  cursor:pointer;
  user-select:none;
  animation:pop 0.2s ease;
  transition:0.2s;
  box-shadow:0 0 20px rgba(0,0,0,0.4);
}

.monster:active{
  transform:scale(0.9);
}

.dead{
  animation:kill 0.4s forwards;
}

@keyframes pop{
  from{
    transform:scale(0);
  }
  to{
    transform:scale(1);
  }
}

@keyframes kill{
  0%{
    transform:scale(1) rotate(0deg);
    opacity:1;
  }

  50%{
    transform:scale(1.4) rotate(20deg);
  }

  100%{
    transform:scale(0) rotate(180deg);
    opacity:0;
  }
}

.hit-effect{
  position:absolute;
  font-size:35px;
  pointer-events:none;
  animation:hit 0.5s forwards;
}

@keyframes hit{
  0%{
    opacity:1;
    transform:scale(0.5);
  }

  100%{
    opacity:0;
    transform:scale(2);
  }
}

.game-over{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.9);
  padding:30px;
  border-radius:20px;
  text-align:center;
  display:none;
  z-index:20;
}

.game-over h1{
  margin-bottom:15px;
  font-size:36px;
}

.game-over button{
  margin-top:15px;
  padding:12px 25px;
  border:none;
  border-radius:10px;
  background:#ff4d6d;
  color:white;
  font-size:18px;
  cursor:pointer;
}

.game-over button:hover{
  background:#ff1e4d;
}
</style>
</head>
<body>

<div class="game-container">

  <div class="top-bar">
    <h2>⚔️ Monster Hunter</h2>
    <div class="score">Kills: <span id="score">0</span></div>
    <div class="timer">Time: <span id="time">30</span>s</div>
  </div>

  <div id="gameArea"></div>

  <div class="game-over" id="gameOver">
    <h1>💀 Game Over</h1>
    <p>Total Monster Kills: <span id="finalScore">0</span></p>
    <button onclick="restartGame()">Play Again</button>
  </div>

</div>

<script>
const gameArea = document.getElementById('gameArea');
const scoreEl = document.getElementById('score');
const timeEl = document.getElementById('time');
const finalScoreEl = document.getElementById('finalScore');
const gameOverBox = document.getElementById('gameOver');

let score = 0;
let timeLeft = 30;
let gameRunning = true;

const monsters = ['👾','👹','👻','💀','🧟','🐲'];

function createMonster(){

  if(!gameRunning) return;

  const monster = document.createElement('div');
  monster.classList.add('monster');

  monster.innerHTML =
    monsters[Math.floor(Math.random()*monsters.length)];

  const x =
    Math.random() * (window.innerWidth - 120);

  const y =
    Math.random() * (window.innerHeight - 220) + 100;

  monster.style.left = x + 'px';
  monster.style.top = y + 'px';

  monster.style.background =
    `hsl(${Math.random()*360},70%,55%)`;

  monster.addEventListener('click',()=>{

    if(monster.classList.contains('dead')) return;

    monster.classList.add('dead');

    score++;
    scoreEl.innerText = score;

    // Hit Effect
    const hit = document.createElement('div');
    hit.classList.add('hit-effect');

    hit.innerHTML = '💥';

    hit.style.left = x + 25 + 'px';
    hit.style.top = y + 25 + 'px';

    gameArea.appendChild(hit);

    setTimeout(()=>{
      hit.remove();
    },500);

    // Remove monster after kill animation
    setTimeout(()=>{
      monster.remove();
    },400);

  });

  gameArea.appendChild(monster);

  // Auto remove if not killed
  setTimeout(()=>{
    if(monster.parentElement){
      monster.remove();
    }
  },1500);
}

const monsterInterval = setInterval(()=>{
  createMonster();
},500);

const timer = setInterval(()=>{

  timeLeft--;
  timeEl.innerText = timeLeft;

  if(timeLeft <= 0){
    endGame();
  }

},1000);

function endGame(){

  gameRunning = false;

  clearInterval(timer);
  clearInterval(monsterInterval);

  finalScoreEl.innerText = score;

  gameOverBox.style.display = 'block';
}

function restartGame(){
  location.reload();
}
</script>

</body>
</html>
